name: Publish Release Assets

on:
  push:
    branches: [ main ]
    paths:
      - 'staging/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload staged installers and APKs to GitHub Release v3.5.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(staging/*.exe staging/*.apk)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release view v3.5.0 >/dev/null 2>&1 || gh release create v3.5.0 --title "Vin Vin's Studio v3.5.0 (Windows & Android)" --notes "Official public Windows x64 (.exe) and Android (.apk) builds of Vin Vin's Studio."
            gh release upload v3.5.0 "${FILES[@]}" --clobber
          fi
