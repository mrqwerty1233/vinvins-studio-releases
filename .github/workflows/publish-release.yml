name: Publish Release Assets

on:
  push:
    branches: [ main ]
    paths:
      - 'staging/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload staged installers and APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          TAG="v3.5.0"
          TITLE="Vin Vin's Studio v3.5.0 (Windows & Android)"
          NOTES="Official public Windows x64 (.exe) and Android (.apk) builds of Vin Vin's Studio."
          if [ -f staging/RELEASE_TAG ]; then
            TAG="$(tr -d ' \r\n' < staging/RELEASE_TAG)"
            TITLE="Vin Vin's Studio ${TAG}"
            NOTES="Official public release ${TAG} of Vin Vin's Studio (Android APK & Desktop installers)."
          fi
          FILES=(staging/*.exe staging/*.apk)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          fi
